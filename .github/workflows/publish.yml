name: Publish schools list

on:
  schedule:
    # 00:00 UTC = 03:00 in Baghdad. GitHub may start scheduled runs a few minutes late.
    - cron: '0 0 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export schools from Firestore
        run: node export_schools.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off scheduled workflows after 60 days without repository activity.
  # Calling the "enable workflow" API on every run resets that counter, with no commits needed.
  # This job is separate, so it also runs when the export job fails.
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
